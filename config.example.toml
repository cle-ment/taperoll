# TapeRoll settings.
#
# Copy to config.toml (gitignored) and keep only what you change — every setting
# below shows its default. Invalid values are reported in the app and replaced by
# the default, so a typo never keeps the recorder from starting.

[audio]
# Input device index or (part of its) name; leave out for the system default.
# Falls back to the system default if the device isn't connected.
# `pixi run devices` lists what's available.
# device = "DL32S"
sample_rate = 48000
dtype = "int32"                # "int16" or "int32" (int32 keeps stems at 24-bit)

[recording]
output_dir = "recordings"      # relative to this folder
min_seconds = 10               # shorter takes are discarded
normalize = true               # boost the mixdown so its peak hits normalize_target_db…
normalize_target_db = -1.0     # …only ever scaling up, never down
encode_mp3 = true              # requires ffmpeg
mp3_bitrate = "192k"
delete_wav_after_encode = true

[upload]
enabled = true
destination = ""               # rclone remote:path, e.g. "gdrive:Band/Rehearsals/"; empty = no upload
delete_after_upload = true     # delete the local MP3 once uploaded
# notify_command = "say {file} uploaded"   # run after each upload; {file} = file path

[setlist]
file = "setlist.txt"           # relative to this folder (or absolute); keep several
                               # in a folder, e.g. "setlists/friday.txt", and pick one

[metronome]
bpm_default = 120
bpm_min = 20
bpm_max = 300
click_freq = 1000              # Hz
click_freq_accent = 1800       # Hz, beat 1
click_dur = 0.015              # seconds
volume = 0.7                   # 0.0–1.0
subdivision_volume_mult = 0.3  # relative to volume
time_sigs = [1, 3, 4, 5, 6]    # beats per bar that [t] cycles through

[stems]
# upload_min_rating = 4        # only upload stems of takes rated at least this (default: upload all)
format = "flac"                # "flac" (lossless) or "mp3" (small; uses recording.mp3_bitrate)
silence_db = -60.0             # stems whose peak stays below this are dropped
delete_after_upload = true     # delete the local stems folder once uploaded

# Which input channels (1-based, as numbered on the mixer) hold what.
# Without [[channels.stem]] entries, stems mode is unavailable.
[channels]
mixdown = [1, 2]               # stereo (L, R) or mono [1]; recorded for every take

# [[channels.stem]]
# channel = 3
# name = "kick"
#
# [[channels.stem]]
# channel = 4
# name = "snare"
